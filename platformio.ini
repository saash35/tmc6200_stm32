; PlatformIO project: SimpleFOC + TMC6200 (SPI) on ST Nucleo-F401RE
; Build:   pio run            (or the tick icon in the VS Code status bar)
; Flash:   pio run -t upload  (arrow icon)  - uses the on-board ST-Link
; Monitor: pio device monitor (plug icon)   - 115200 baud, ST-Link virtual COM port

[env:nucleo_f401re]
platform = ststm32
board = nucleo_f401re
framework = arduino

upload_protocol = stlink
debug_tool = stlink

monitor_speed = 115200
monitor_eol = LF            ; Commander expects '\n' at the end of each command
monitor_echo = yes
monitor_filters = send_on_enter

; SimpleFOC needs lib_archive = false on PlatformIO, otherwise its weak
; hardware-specific functions are not linked in and PWM silently does nothing.
lib_archive = false
lib_deps =
    askuric/Simple FOC@^2.4.0

build_flags =
    -D SIMPLEFOC_STM32_DEBUG     ; print the timer/pin setup SimpleFOC chose at boot
platform_packages =
    platformio/framework-arduinoststm32 @ https://github.com/stm32duino/Arduino_Core_STM32/archive/refs/tags/2.12.0.zip